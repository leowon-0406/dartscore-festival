<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111622" />
    <title>DartScore · 축제 운영</title>
    <meta name="description" content="학교 축제 다트 게임의 빠르고 정확한 점수 기록" />
    <style>
      :root {
        --ink: #f7f8fa;
        --muted: #9aa3b4;
        --surface: rgba(28, 34, 48, .82);
        --surface-strong: #202838;
        --line: rgba(255,255,255,.1);
        --red: #ef4a5a;
        --teal: #1dbea5;
        --gold: #ffc857;
        --shadow: 0 22px 55px rgba(0,0,0,.32);
      }
      * { box-sizing: border-box; }
      html { background: #111622; }
      body {
        margin: 0; min-height: 100dvh; color: var(--ink);
        font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
        background:
          radial-gradient(circle at 18% 0%, rgba(29,190,165,.15), transparent 28rem),
          radial-gradient(circle at 90% 100%, rgba(239,74,90,.12), transparent 32rem),
          #111622;
      }
      button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
      .app { width: min(1200px, 100%); margin: 0 auto; padding: 20px max(18px, env(safe-area-inset-right)) 30px max(18px, env(safe-area-inset-left)); }
      header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
      .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
      .brand-mark { display:grid; place-items:center; width:38px; height:38px; border-radius:13px; background:linear-gradient(145deg,var(--teal),#137b79); box-shadow:0 8px 22px rgba(29,190,165,.25); }
      .brand-mark svg { width:23px; height:23px; }
      .eyebrow { color: var(--teal); font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform:uppercase; }
      h1 { margin:2px 0 0; font-size: 18px; letter-spacing:-.04em; }
      .round { color:var(--muted); font-size:13px; font-weight:700; white-space:nowrap; }
      .dashboard { display:grid; grid-template-columns: minmax(360px, 1.25fr) minmax(280px, .75fr); gap:18px; align-items:start; }
      .card { border:1px solid var(--line); background:var(--surface); backdrop-filter: blur(16px); border-radius:24px; box-shadow:var(--shadow); }
      .board-card { padding: clamp(13px,2vw,24px); }
      .board-top { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:1px 3px 13px; }
      .board-note { font-size:13px; font-weight:700; color:var(--muted); }
      .board-note b { color:var(--ink); }
      .precision-open { border:1px solid rgba(29,190,165,.42); background:rgba(29,190,165,.1); color:#b9fff0; border-radius:12px; padding:9px 11px; font-size:12px; font-weight:800; cursor:pointer; }
      .precision-open:active { transform:scale(.97); }
      .board-wrap { position:relative; width:min(100%, 570px); margin:auto; aspect-ratio:1; border-radius:50%; overflow:hidden; touch-action: manipulation; background:#06080c; box-shadow:0 14px 34px rgba(0,0,0,.5), inset 0 0 0 6px #111; }
      .board-wrap::after { content:""; position:absolute; inset:0; border-radius:50%; pointer-events:none; box-shadow: inset 0 0 35px rgba(0,0,0,.22); }
      .dartboard { display:block; width:100%; height:100%; user-select:none; }
      .dartboard .segment { stroke:#171b22; stroke-width:1.35; }
      .dartboard .wire { fill:none; stroke:#c8c3b6; stroke-opacity:.78; stroke-width:.9; pointer-events:none; }
      .dartboard text { fill:#f2eee5; font-family:Arial, sans-serif; font-size:13px; font-weight:800; text-anchor:middle; dominant-baseline:central; pointer-events:none; paint-order:stroke; stroke:#202329; stroke-width:1.4px; }
      .hit-flash { position:absolute; width:25%; aspect-ratio:1; border:2px solid #fff; border-radius:50%; transform:translate(-50%,-50%) scale(.3); opacity:0; pointer-events:none; }
      .hit-flash.show { animation:flash .36s ease-out both; }
      @keyframes flash { 20% { opacity: .95; } 100% { opacity:0; transform:translate(-50%,-50%) scale(1.2); } }
      .side { display:grid; gap:18px; }
      .score-card { padding:24px; overflow:hidden; position:relative; }
      .score-card::before { content:""; position:absolute; width:190px; height:190px; right:-80px; top:-90px; background:radial-gradient(circle,rgba(255,200,87,.17),transparent 70%); }
      .score-label { position:relative; display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:13px; font-weight:800; }
      .live { display:flex; align-items:baseline; gap:10px; margin:6px 0 12px; position:relative; }
      #total { font-size:clamp(55px,7vw,78px); line-height:.95; letter-spacing:-.075em; font-variant-numeric:tabular-nums; }
      .points { color:var(--muted); font-size:14px; font-weight:800; }
      .last-hit { position:relative; display:flex; align-items:center; gap:10px; min-height:40px; }
      .chip { border:1px solid rgba(255,255,255,.13); background:rgba(255,255,255,.07); border-radius:999px; padding:8px 11px; font-size:13px; font-weight:800; }
      .chip span { color:var(--gold); }
      .last-desc { color:var(--muted); font-size:13px; }
      .actions { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
      .action { border-radius:15px; padding:13px 12px; border:1px solid var(--line); background:#293244; font-size:14px; font-weight:850; cursor:pointer; }
      .action:hover { background:#323d51; }
      .action:active { transform:translateY(1px); }
      .action.danger { background:rgba(239,74,90,.09); color:#ffb6bd; border-color:rgba(239,74,90,.24); }
      .history { padding:19px 20px 14px; }
      .history-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; }
      h2 { margin:0; font-size:15px; letter-spacing:-.02em; }
      #throws { color:var(--muted); font-size:12px; font-weight:750; }
      #history-list { list-style:none; padding:0; margin:0; max-height:230px; overflow:auto; scrollbar-width:thin; }
      .history-row { display:grid; grid-template-columns:29px 1fr auto; gap:10px; align-items:center; padding:12px 0; border-top:1px solid var(--line); }
      .history-num { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
      .history-kind { font-size:13px; font-weight:750; }
      .history-score { color:var(--gold); font-size:16px; font-weight:900; font-variant-numeric:tabular-nums; }
      .empty { color:var(--muted); text-align:center; padding:23px 0 18px; font-size:13px; }
      .hint { margin:16px 4px 0; color:#788396; font-size:12px; line-height:1.55; text-align:center; }
      .modal { position:fixed; inset:0; z-index:5; display:none; place-items:center; padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left)); background:rgba(4,7,12,.82); backdrop-filter:blur(12px); }
      .modal.open { display:grid; }
      .precision-panel { width:min(780px,100%); height:min(850px,100%); padding:18px; display:grid; grid-template-rows:auto 1fr auto; gap:14px; border:1px solid rgba(255,255,255,.14); border-radius:25px; background:#171e2b; box-shadow:0 30px 80px rgba(0,0,0,.55); }
      .precision-header { display:flex; align-items:center; justify-content:space-between; gap:10px; }
      .precision-title { font-size:16px; font-weight:900; }
      .close { width:37px; height:37px; display:grid; place-items:center; border:1px solid var(--line); border-radius:12px; background:#252e40; cursor:pointer; font-size:21px; line-height:1; }
      .precision-stage { min-height:0; width:min(100%, 650px); aspect-ratio:1; justify-self:center; align-self:center; overflow:hidden; border-radius:22px; background:#06080c; box-shadow:inset 0 0 0 1px rgba(255,255,255,.08); touch-action:none; }
      .precision-stage .dartboard { width:100%; height:100%; }
      .precision-controls { display:grid; grid-template-columns:auto auto 1fr; gap:8px; align-items:center; }
      .zoom-btn { width:44px; height:42px; border:1px solid var(--line); border-radius:13px; background:#252e40; font-size:23px; font-weight:500; cursor:pointer; }
      #zoom-level { color:var(--muted); font-size:12px; font-weight:800; padding-left:4px; }
      .precision-help { grid-column:1/-1; color:var(--muted); font-size:12px; line-height:1.45; margin:3px 0 0; }
      @media (max-width: 780px) { .app{padding-top:15px}.dashboard{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr;align-items:start}.history{height:100%}.score-card{padding:19px}.board-card{padding:12px}.board-wrap{width:min(100%,520px)} }
      @media (max-width: 510px) { header{margin-bottom:12px}.round{display:none}.side{grid-template-columns:1fr}.history{order:2}.board-note{font-size:12px}#total{font-size:68px}.precision-panel{padding:14px;border-radius:20px}.precision-stage{border-radius:16px} }
    </style>
  </head>
  <body>
    <main class="app">
      <header>
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="white" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="white" stroke-width="1.8"/><path d="M12 1.8v5M22.2 12h-5M12 22.2v-5M1.8 12h5" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg></div>
          <div><div class="eyebrow">Festival game desk</div><h1>DartScore</h1></div>
        </div>
        <div class="round">실시간 점수 기록</div>
      </header>
      <section class="dashboard" aria-label="다트 점수판">
        <section class="card board-card">
          <div class="board-top"><div class="board-note"><b>다트판을 눌러</b> 점수를 기록하세요</div><button class="precision-open" id="open-precision" type="button">⌕ 정밀 확대</button></div>
          <div class="board-wrap" id="board-wrap">
            <svg class="dartboard" id="main-board" viewBox="0 0 300 300" role="img" aria-label="탭해서 다트 점수를 기록하는 다트판"></svg>
            <i class="hit-flash" id="hit-flash"></i>
          </div>
          <p class="hint">싱글 · 더블 · 트리플 링과 불을 실제 위치대로 판정합니다.</p>
        </section>
        <aside class="side">
          <section class="card score-card" aria-live="polite">
            <div class="score-label"><span>현재 합계</span><span id="turn-label">0 THROWS</span></div>
            <div class="live"><strong id="total">0</strong><span class="points">POINTS</span></div>
            <div class="last-hit"><div class="chip" id="last-chip">대기 중</div><div class="last-desc" id="last-desc">다트판을 터치해 주세요</div></div>
          </section>
          <div class="actions"><button class="action" id="undo" type="button">↶ 이전</button><button class="action danger" id="reset" type="button">↺ 초기화</button></div>
          <section class="card history">
            <div class="history-head"><h2>기록</h2><span id="throws">아직 기록 없음</span></div>
            <ol id="history-list"><li class="empty">첫 다트의 위치를 눌러 주세요</li></ol>
          </section>
        </aside>
      </section>
    </main>
    <div class="modal" id="precision-modal" role="dialog" aria-modal="true" aria-labelledby="precision-title">
      <section class="precision-panel">
        <div class="precision-header"><div><div class="eyebrow">Precision mode</div><div class="precision-title" id="precision-title">정밀 확대 입력</div></div><button class="close" id="close-precision" type="button" aria-label="정밀 확대 닫기">×</button></div>
        <div class="precision-stage" id="precision-stage"><svg class="dartboard" id="precision-board" viewBox="0 0 300 300" role="img" aria-label="정밀 점수 입력 다트판"></svg></div>
        <div class="precision-controls"><button class="zoom-btn" id="zoom-out" type="button" aria-label="축소">−</button><button class="zoom-btn" id="zoom-in" type="button" aria-label="확대">+</button><span id="zoom-level">100%</span><p class="precision-help">탭하면 기록됩니다. 확대 후에는 한 손가락으로 드래그해 위치를 옮기거나, 두 손가락으로 확대·축소할 수 있어요.</p></div>
      </section>
    </div>
    <script>
      (() => {
        const numbers = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
        const center = 150;
        const radii = { bull: 13, outerBull: 25, tripleIn: 43, tripleOut: 52, doubleIn: 112, doubleOut: 126 };
        let hits = [];
        let flashTimer;
        let view = { zoom: 1, cx: 150, cy: 150 };
        const svgNS = 'http://www.w3.org/2000/svg';
        const $ = (sel) => document.querySelector(sel);

        function polar(r, a) { return [center + r * Math.cos(a), center + r * Math.sin(a)]; }
        function wedge(inner, outer, start, end) {
          const [x1,y1] = polar(outer,start), [x2,y2] = polar(outer,end);
          const [x3,y3] = polar(inner,end), [x4,y4] = polar(inner,start);
          return `M ${x1.toFixed(3)} ${y1.toFixed(3)} A ${outer} ${outer} 0 0 1 ${x2.toFixed(3)} ${y2.toFixed(3)} L ${x3.toFixed(3)} ${y3.toFixed(3)} A ${inner} ${inner} 0 0 0 ${x4.toFixed(3)} ${y4.toFixed(3)} Z`;
        }
        function el(tag, attrs={}) { const node = document.createElementNS(svgNS,tag); Object.entries(attrs).forEach(([k,v]) => node.setAttribute(k,v)); return node; }
        function drawBoard(svg) {
          svg.innerHTML = '';
          svg.append(el('circle',{cx:center,cy:center,r:132,fill:'#161a21'}));
          numbers.forEach((value,i) => {
            const start = -Math.PI/2 - Math.PI/20 + i*(Math.PI/10), end = start + Math.PI/10;
            const light = i % 2 === 0;
            const ring = (inner,outer,fill) => svg.append(el('path',{d:wedge(inner,outer,start,end),fill,class:'segment'}));
            ring(radii.tripleOut, radii.doubleIn, light ? '#eee9df' : '#25282c');
            ring(radii.doubleOut, 131, i % 2 ? '#1dbea5' : '#ef4a5a');
            ring(radii.tripleIn, radii.tripleOut, i % 2 ? '#1dbea5' : '#ef4a5a');
            ring(radii.outerBull, radii.tripleIn, light ? '#eee9df' : '#25282c');
            const [tx,ty] = polar(146, (start+end)/2);
            const text = el('text',{x:tx,y:ty}); text.textContent=value; svg.append(text);
          });
          [radii.doubleOut,radii.doubleIn,radii.tripleOut,radii.tripleIn,radii.outerBull].forEach(r => svg.append(el('circle',{cx:center,cy:center,r,class:'wire'})));
          svg.append(el('circle',{cx:center,cy:center,r:radii.outerBull,fill:'#1dbea5',class:'segment'}));
          svg.append(el('circle',{cx:center,cy:center,r:radii.bull,fill:'#ef4a5a',class:'segment'}));
          svg.append(el('circle',{cx:center,cy:center,r:radii.bull,class:'wire'}));
        }
        drawBoard($('#main-board')); drawBoard($('#precision-board'));

        function scoreAt(x,y) {
          const dx=x-center, dy=y-center, r=Math.hypot(dx,dy);
          if (r > radii.doubleOut) return { score:0, name:'미스', short:'MISS' };
          if (r <= radii.bull) return { score:50, name:'이너 불', short:'BULL' };
          if (r <= radii.outerBull) return { score:25, name:'아우터 불', short:'25 BULL' };
          let a=Math.atan2(dy,dx) + Math.PI/2 + Math.PI/20;
          while(a<0) a+=Math.PI*2;
          const n=numbers[Math.floor(a/(Math.PI/10)) % 20];
          if (r >= radii.doubleIn) return { score:n*2, name:`더블 ${n}`, short:`D${n}` };
          if (r >= radii.tripleIn && r <= radii.tripleOut) return { score:n*3, name:`트리플 ${n}`, short:`T${n}` };
          return { score:n, name:`싱글 ${n}`, short:`S${n}` };
        }
        function addHit(hit) {
          hits.push(hit); render();
        }
        function render() {
          const total=hits.reduce((sum,h)=>sum+h.score,0), last=hits.at(-1);
          $('#total').textContent=total;
          $('#turn-label').textContent=`${hits.length} THROW${hits.length===1?'':'S'}`;
          $('#throws').textContent=hits.length?`총 ${hits.length}회`:'아직 기록 없음';
          $('#undo').disabled=!hits.length;
          $('#undo').style.opacity=hits.length?'1':'.45';
          if(last) { $('#last-chip').innerHTML=`<span>+${last.score}</span> ${last.short}`; $('#last-desc').textContent=last.name; }
          else { $('#last-chip').textContent='대기 중'; $('#last-desc').textContent='다트판을 터치해 주세요'; }
          const list=$('#history-list');
          if(!hits.length) { list.innerHTML='<li class="empty">첫 다트의 위치를 눌러 주세요</li>'; return; }
          list.innerHTML=[...hits].reverse().map((hit,idx)=>`<li class="history-row"><span class="history-num">${String(hits.length-idx).padStart(2,'0')}</span><span class="history-kind">${hit.name}</span><strong class="history-score">+${hit.score}</strong></li>`).join('');
        }
        function flash(x,y) {
          const f=$('#hit-flash'); f.style.left=`${x/3}%`; f.style.top=`${y/3}%`; f.classList.remove('show'); void f.offsetWidth; f.classList.add('show'); clearTimeout(flashTimer); flashTimer=setTimeout(()=>f.classList.remove('show'),380);
        }
        function coordsFromEvent(evt, svg) {
          const rect=svg.getBoundingClientRect();
          const vb=svg.viewBox.baseVal;
          return { x:vb.x+(evt.clientX-rect.left)/rect.width*vb.width, y:vb.y+(evt.clientY-rect.top)/rect.height*vb.height };
        }
        function pointOnMain(evt) { const p=coordsFromEvent(evt,$('#main-board')); const h=scoreAt(p.x,p.y); addHit(h); flash(p.x,p.y); }
        $('#main-board').addEventListener('pointerup',evt=>{ if(evt.pointerType==='mouse'&&evt.button!==0)return; pointOnMain(evt); });
        $('#undo').addEventListener('click',()=>{if(hits.length){hits.pop();render();}});
        $('#reset').addEventListener('click',()=>{if(hits.length && confirm('기록한 점수를 모두 초기화할까요?')){hits=[];render();}});

        const modal=$('#precision-modal'), psvg=$('#precision-board'), stage=$('#precision-stage');
        function applyView(){ const size=300/view.zoom; psvg.setAttribute('viewBox',`${view.cx-size/2} ${view.cy-size/2} ${size} ${size}`); $('#zoom-level').textContent=`${Math.round(view.zoom*100)}%`; }
        function setZoom(next, anchor={x:view.cx,y:view.cy}) { view.zoom=Math.max(1,Math.min(3,next)); const size=300/view.zoom/2; view.cx=Math.max(size,Math.min(300-size,anchor.x)); view.cy=Math.max(size,Math.min(300-size,anchor.y)); applyView(); }
        function openPrecision(){modal.classList.add('open'); view={zoom:1,cx:150,cy:150};applyView();setTimeout(()=>$('#close-precision').focus(),0);}
        function closePrecision(){modal.classList.remove('open');$('#open-precision').focus();}
        $('#open-precision').addEventListener('click',openPrecision); $('#close-precision').addEventListener('click',closePrecision);
        modal.addEventListener('click',e=>{if(e.target===modal)closePrecision();});
        document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))closePrecision();});
        $('#zoom-in').addEventListener('click',()=>setZoom(view.zoom*1.35)); $('#zoom-out').addEventListener('click',()=>setZoom(view.zoom/1.35));
        const pointers=new Map(); let gesture={moved:false,last:null,pinch:null};
        stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});gesture.moved=false; if(pointers.size===1)gesture.last={x:e.clientX,y:e.clientY}; if(pointers.size===2){const p=[...pointers.values()];gesture.pinch={dist:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),zoom:view.zoom};}});
        stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const before=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size>=2){const p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(gesture.pinch){setZoom(gesture.pinch.zoom*d/gesture.pinch.dist);gesture.moved=true;}return;}if(view.zoom>1&&gesture.last){const dx=e.clientX-gesture.last.x,dy=e.clientY-gesture.last.y;if(Math.abs(dx)+Math.abs(dy)>3){const vb=psvg.viewBox.baseVal,rect=psvg.getBoundingClientRect();view.cx-=dx/rect.width*vb.width;view.cy-=dy/rect.height*vb.height;const half=150/view.zoom;view.cx=Math.max(half,Math.min(300-half,view.cx));view.cy=Math.max(half,Math.min(300-half,view.cy));applyView();gesture.last={x:e.clientX,y:e.clientY};gesture.moved=true;}}});
        function finishPrecision(e){if(!pointers.has(e.pointerId))return;if(!gesture.moved&&pointers.size===1){const p=coordsFromEvent(e,psvg);addHit(scoreAt(p.x,p.y));closePrecision();}pointers.delete(e.pointerId);if(pointers.size<2)gesture.pinch=null;}
        stage.addEventListener('pointerup',finishPrecision);stage.addEventListener('pointercancel',e=>pointers.delete(e.pointerId));
        render();
      })();
    </script>
  </body>
</html>
