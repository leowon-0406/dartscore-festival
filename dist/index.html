<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>다트 점수</title>
    <meta name="description" content="학교 축제 다트 게임 6회 점수 기록" />
    <style>
      :root { --bg:#000; --ink:#f5f5f5; --muted:#8d8d8d; --line:#292929; --panel:#0b0b0b; --red:#d83b45; --green:#159782; }
      * { box-sizing:border-box; }
      html, body { margin:0; min-height:100%; background:var(--bg); }
      body { color:var(--ink); font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif; }
      button { color:inherit; font:inherit; -webkit-tap-highlight-color:transparent; }
      button:focus-visible { outline:2px solid #fff; outline-offset:2px; }
      .app { max-width:1120px; min-height:100dvh; margin:0 auto; padding:24px 24px 34px; }
      header { display:flex; align-items:baseline; justify-content:space-between; padding-bottom:17px; border-bottom:1px solid var(--line); }
      h1 { margin:0; font-size:20px; letter-spacing:-.05em; font-weight:750; }
      .game-count { color:var(--muted); font-size:13px; font-weight:700; letter-spacing:.04em; }
      .layout { display:grid; grid-template-columns:minmax(390px,1.28fr) minmax(290px,.72fr); gap:36px; align-items:start; padding-top:25px; }
      .board-head { display:flex; align-items:center; justify-content:space-between; margin:0 1px 13px; }
      .board-head p { margin:0; color:var(--muted); font-size:13px; }
      .text-button { appearance:none; border:0; padding:0; background:transparent; color:var(--ink); font-size:13px; font-weight:700; cursor:pointer; text-decoration:underline; text-underline-offset:4px; }
      .board-wrap { position:relative; width:min(100%,580px); margin:0 auto; aspect-ratio:1; background:transparent; touch-action:manipulation; }
      .dartboard { display:block; width:100%; height:100%; user-select:none; }
      .dartboard .segment { stroke:#141414; stroke-width:1.35; }
      .dartboard .wire { fill:none; stroke:#b6b1a7; stroke-opacity:.68; stroke-width:.8; pointer-events:none; }
      .dartboard text { fill:#fff; font-family:Arial,sans-serif; font-size:14px; font-weight:800; text-anchor:middle; dominant-baseline:central; pointer-events:none; paint-order:stroke; stroke:#111; stroke-width:2px; }
      .dartboard .hit-marker { fill:none; stroke:#ff3b30; stroke-width:2.4px; stroke-linecap:round; pointer-events:none; }
      .guide { margin:13px 0 0; color:var(--muted); font-size:12px; line-height:1.5; text-align:center; }
      .score-panel { border-top:2px solid #fff; padding-top:16px; }
      .score-meta { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:12px; font-weight:800; letter-spacing:.08em; }
      .total { margin:4px 0 0; font-size:clamp(66px,9vw,96px); line-height:.94; letter-spacing:-.08em; font-variant-numeric:tabular-nums; }
      .last { min-height:46px; margin:17px 0 21px; padding:12px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:13px; }
      .last-label { color:var(--muted); font-weight:700; }
      #last-hit { font-weight:800; text-align:right; }
      .miss { width:100%; min-height:54px; border:1px solid #fafafa; border-radius:0; background:#fff; color:#000; font-size:15px; font-weight:850; cursor:pointer; }
      .miss:disabled { opacity:.35; cursor:not-allowed; }
      .utility { display:grid; grid-template-columns:1fr 1fr; gap:0; margin-top:8px; }
      .utility button { min-height:44px; border:1px solid var(--line); border-right:0; border-radius:0; background:var(--panel); color:var(--ink); font-size:13px; font-weight:700; cursor:pointer; }
      .utility button:last-child { border-right:1px solid var(--line); }
      .utility button:disabled { color:#555; cursor:not-allowed; }
      .restart { display:none; width:100%; min-height:54px; margin-top:8px; border:1px solid #fff; border-radius:0; background:#fff; color:#000; font-size:15px; font-weight:850; cursor:pointer; }
      .restart.visible { display:block; }
      .history { margin-top:29px; }
      .history-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
      h2 { margin:0; font-size:14px; letter-spacing:-.03em; }
      #throws { color:var(--muted); font-size:12px; }
      #history-list { list-style:none; margin:0; padding:0; border-top:1px solid var(--line); }
      .throw-row { display:grid; grid-template-columns:33px 1fr auto; align-items:center; min-height:42px; border-bottom:1px solid var(--line); font-size:13px; }
      .throw-no { color:var(--muted); font-variant-numeric:tabular-nums; }
      .throw-name { font-weight:650; }
      .throw-score { color:var(--muted); font-weight:800; font-variant-numeric:tabular-nums; }
      .throw-row.used .throw-score { color:var(--ink); }
      .empty-value { color:#555; }
      .modal { position:fixed; inset:0; z-index:5; display:none; place-items:center; padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left)); background:#000; }
      .modal.open { display:grid; }
      .precision-panel { width:min(780px,100%); height:min(860px,100%); display:grid; grid-template-rows:auto 1fr auto; gap:15px; }
      .precision-head { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); padding-bottom:12px; }
      .precision-title { font-size:15px; font-weight:800; }
      .close { border:0; background:transparent; padding:0 0 0 18px; font-size:26px; cursor:pointer; line-height:1; }
      .precision-stage { width:min(100%,670px); min-height:0; aspect-ratio:1; justify-self:center; align-self:center; overflow:hidden; background:#050505; touch-action:none; }
      .precision-stage .dartboard { width:100%; height:100%; }
      .precision-controls { display:grid; grid-template-columns:auto auto 1fr; gap:8px; align-items:center; }
      .zoom-btn { width:44px; height:42px; border:1px solid var(--line); border-radius:0; background:#0b0b0b; cursor:pointer; font-size:22px; }
      #zoom-level { color:var(--muted); font-size:12px; font-weight:700; padding-left:5px; }
      .precision-help { grid-column:1/-1; margin:1px 0 0; color:var(--muted); font-size:12px; line-height:1.45; }
      @media (max-width:760px) { .app{padding:17px 16px 26px}.layout{grid-template-columns:1fr;gap:26px;padding-top:18px}.board-wrap{width:min(100%,540px)}.history{margin-top:24px}.score-panel{max-width:540px;margin:auto;width:100%} }
      @media (max-width:420px) { h1{font-size:18px}.total{font-size:76px}.board-head p{font-size:12px}.guide{font-size:11px} }
    </style>
  </head>
  <body>
    <main class="app">
      <header><h1>다트 점수</h1><div class="game-count">6 DARTS</div></header>
      <section class="layout" aria-label="다트 점수 기록">
        <section>
          <div class="board-head"><p>점수 구역을 터치하세요</p><button class="text-button" id="open-precision" type="button">확대</button></div>
          <div class="board-wrap" id="board-wrap"><svg class="dartboard" id="main-board" viewBox="0 0 300 300" role="img" aria-label="탭해서 점수를 기록하는 다트판"></svg></div>
          <p class="guide">점수 구역 밖을 누르면 기록하지 않습니다. 미스는 오른쪽 버튼으로 입력하세요.</p>
        </section>
        <aside>
          <section class="score-panel" aria-live="polite">
            <div class="score-meta"><span>합계</span><span id="turn-label">0 / 6</span></div>
            <div class="total" id="total">0</div>
            <div class="last"><span class="last-label">최근 기록</span><span id="last-hit">—</span></div>
            <button class="miss" id="miss" type="button">미스 기록 · 0점</button>
            <div class="utility"><button id="undo" type="button" disabled>이전</button><button id="reset" type="button">초기화</button></div>
            <button class="restart" id="restart" type="button">다시 시작</button>
          </section>
          <section class="history"><div class="history-head"><h2>6회 기록</h2><span id="throws">0 / 6</span></div><ol id="history-list"></ol></section>
        </aside>
      </section>
    </main>
    <div class="modal" id="precision-modal" role="dialog" aria-modal="true" aria-labelledby="precision-title">
      <section class="precision-panel">
        <div class="precision-head"><div class="precision-title" id="precision-title">확대 입력</div><button class="close" id="close-precision" type="button" aria-label="확대 입력 닫기">×</button></div>
        <div class="precision-stage" id="precision-stage"><svg class="dartboard" id="precision-board" viewBox="0 0 300 300" role="img" aria-label="확대된 다트판"></svg></div>
        <div class="precision-controls"><button class="zoom-btn" id="zoom-out" type="button" aria-label="축소">−</button><button class="zoom-btn" id="zoom-in" type="button" aria-label="확대">+</button><span id="zoom-level">100%</span><p class="precision-help">탭해 점수를 기록합니다. 확대 후에는 한 손가락으로 이동하고, 두 손가락으로 확대·축소할 수 있습니다.</p></div>
      </section>
    </div>
    <script>
      (() => {
        const MAX_THROWS = 6;
        const numbers = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
        const center = 150;
        const radii = { bull:13, outerBull:25, tripleIn:43, tripleOut:52, doubleIn:112, doubleOut:126 };
        let hits = [];
        let view = { zoom:1, cx:150, cy:150 };
        const svgNS = 'http://www.w3.org/2000/svg';
        const $ = (selector) => document.querySelector(selector);

        function polar(radius, angle) { return [center + radius * Math.cos(angle), center + radius * Math.sin(angle)]; }
        function wedge(inner, outer, start, end) {
          const [x1,y1] = polar(outer,start), [x2,y2] = polar(outer,end), [x3,y3] = polar(inner,end), [x4,y4] = polar(inner,start);
          return `M ${x1.toFixed(3)} ${y1.toFixed(3)} A ${outer} ${outer} 0 0 1 ${x2.toFixed(3)} ${y2.toFixed(3)} L ${x3.toFixed(3)} ${y3.toFixed(3)} A ${inner} ${inner} 0 0 0 ${x4.toFixed(3)} ${y4.toFixed(3)} Z`;
        }
        function element(tag, attrs={}) { const node = document.createElementNS(svgNS,tag); Object.entries(attrs).forEach(([key,value]) => node.setAttribute(key,value)); return node; }
        function drawBoard(svg) {
          svg.innerHTML = '';
          svg.append(element('circle',{cx:center,cy:center,r:132,fill:'#161616'}));
          numbers.forEach((number,index) => {
            const start = -Math.PI/2 - Math.PI/20 + index*Math.PI/10, end = start + Math.PI/10, light = index % 2 === 0;
            const ring = (inner,outer,fill) => svg.append(element('path',{d:wedge(inner,outer,start,end),fill,class:'segment'}));
            ring(radii.tripleOut,radii.doubleIn,light ? '#ece8df' : '#252525');
            ring(radii.doubleIn,radii.doubleOut,index % 2 ? '#159782' : '#d83b45');
            ring(radii.tripleIn,radii.tripleOut,index % 2 ? '#159782' : '#d83b45');
            ring(radii.outerBull,radii.tripleIn,light ? '#ece8df' : '#252525');
            const [x,y] = polar(143,(start+end)/2), text = element('text',{x,y}); text.textContent=number; svg.append(text);
          });
          [radii.doubleOut,radii.doubleIn,radii.tripleOut,radii.tripleIn,radii.outerBull].forEach(radius => svg.append(element('circle',{cx:center,cy:center,r:radius,class:'wire'})));
          svg.append(element('circle',{cx:center,cy:center,r:radii.outerBull,fill:'#159782',class:'segment'}));
          svg.append(element('circle',{cx:center,cy:center,r:radii.bull,fill:'#d83b45',class:'segment'}));
          svg.append(element('circle',{cx:center,cy:center,r:radii.bull,class:'wire'}));
        }
        drawBoard($('#main-board')); drawBoard($('#precision-board'));

        function scoreAt(x,y) {
          const dx=x-center, dy=y-center, radius=Math.hypot(dx,dy);
          if (radius > radii.doubleOut) return null;
          if (radius <= radii.bull) return {score:50,name:'이너 불',short:'BULL'};
          if (radius <= radii.outerBull) return {score:25,name:'아우터 불',short:'25 BULL'};
          const angle = (Math.atan2(dy,dx) + Math.PI/2 + Math.PI/20 + Math.PI*2) % (Math.PI*2);
          const number = numbers[Math.floor(angle/(Math.PI/10))];
          if (radius >= radii.doubleIn) return {score:number*2,name:`더블 ${number}`,short:`D${number}`};
          if (radius >= radii.tripleIn && radius <= radii.tripleOut) return {score:number*3,name:`트리플 ${number}`,short:`T${number}`};
          return {score:number,name:`싱글 ${number}`,short:`S${number}`};
        }
        function renderMarkers() {
          [$('#main-board'), $('#precision-board')].forEach(svg => {
            svg.querySelector('.hit-marker-layer')?.remove();
            const layer = element('g',{class:'hit-marker-layer'});
            hits.forEach(hit => {
              if (!hit.point) return;
              const size = 3.5, x = hit.point.x, y = hit.point.y;
              layer.append(element('path',{d:`M ${x-size} ${y-size} L ${x+size} ${y+size} M ${x+size} ${y-size} L ${x-size} ${y+size}`,class:'hit-marker'}));
            });
            svg.append(layer);
          });
        }
        function record(hit) { if (hits.length >= MAX_THROWS) return; hits.push(hit); render(); }
        function render() {
          const total=hits.reduce((sum,hit)=>sum+hit.score,0), last=hits.at(-1), complete=hits.length===MAX_THROWS;
          $('#total').textContent=total;
          $('#turn-label').textContent=`${hits.length} / ${MAX_THROWS}`;
          $('#throws').textContent=`${hits.length} / ${MAX_THROWS}`;
          $('#last-hit').textContent=complete ? `완료 · ${total}점` : last ? `${last.name} · ${last.score}점` : '—';
          $('#undo').disabled=!hits.length;
          $('#miss').disabled=complete;
          $('#board-wrap').classList.toggle('locked',complete);
          $('#restart').classList.toggle('visible',complete);
          $('#history-list').innerHTML=Array.from({length:MAX_THROWS},(_,index) => {
            const hit=hits[index];
            return `<li class="throw-row ${hit?'used':''}"><span class="throw-no">${index+1}</span><span class="throw-name ${hit?'':'empty-value'}">${hit ? hit.name : '—'}</span><span class="throw-score">${hit ? hit.score+'점' : '—'}</span></li>`;
          }).join('');
          renderMarkers();
        }
        function eventPoint(event,svg) { const rect=svg.getBoundingClientRect(), viewBox=svg.viewBox.baseVal; return {x:viewBox.x+(event.clientX-rect.left)/rect.width*viewBox.width,y:viewBox.y+(event.clientY-rect.top)/rect.height*viewBox.height}; }
        function scoreFromBoard(event,svg) { const point=eventPoint(event,svg), hit=scoreAt(point.x,point.y); if (hit) record({...hit,point}); return Boolean(hit); }
        $('#main-board').addEventListener('pointerup',event => { if (event.pointerType==='mouse' && event.button!==0) return; scoreFromBoard(event,$('#main-board')); });
        $('#miss').addEventListener('click',()=>record({score:0,name:'미스',short:'MISS'}));
        $('#undo').addEventListener('click',()=>{ if(hits.length){ hits.pop(); render(); } });
        $('#reset').addEventListener('click',()=>{ hits=[]; render(); });
        $('#restart').addEventListener('click',()=>{ hits=[]; render(); });

        const modal=$('#precision-modal'), precisionBoard=$('#precision-board'), stage=$('#precision-stage');
        function applyView() { const size=300/view.zoom; precisionBoard.setAttribute('viewBox',`${view.cx-size/2} ${view.cy-size/2} ${size} ${size}`); $('#zoom-level').textContent=`${Math.round(view.zoom*100)}%`; }
        function setZoom(next,anchor={x:view.cx,y:view.cy}) { view.zoom=Math.max(1,Math.min(3,next)); const half=150/view.zoom; view.cx=Math.max(half,Math.min(300-half,anchor.x)); view.cy=Math.max(half,Math.min(300-half,anchor.y)); applyView(); }
        function openPrecision() { if(hits.length>=MAX_THROWS) return; view={zoom:1,cx:150,cy:150}; applyView(); modal.classList.add('open'); $('#close-precision').focus(); }
        function closePrecision() { modal.classList.remove('open'); $('#open-precision').focus(); }
        $('#open-precision').addEventListener('click',openPrecision); $('#close-precision').addEventListener('click',closePrecision);
        modal.addEventListener('click',event=>{ if(event.target===modal) closePrecision(); });
        document.addEventListener('keydown',event=>{ if(event.key==='Escape'&&modal.classList.contains('open'))closePrecision(); });
        $('#zoom-in').addEventListener('click',()=>setZoom(view.zoom*1.35)); $('#zoom-out').addEventListener('click',()=>setZoom(view.zoom/1.35));
        const pointers=new Map(); let gesture={moved:false,last:null,pinch:null};
        stage.addEventListener('pointerdown',event=>{ stage.setPointerCapture(event.pointerId); pointers.set(event.pointerId,{x:event.clientX,y:event.clientY}); gesture.moved=false; if(pointers.size===1)gesture.last={x:event.clientX,y:event.clientY}; if(pointers.size===2){const p=[...pointers.values()];gesture.pinch={distance:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),zoom:view.zoom};} });
        stage.addEventListener('pointermove',event=>{ if(!pointers.has(event.pointerId))return; pointers.set(event.pointerId,{x:event.clientX,y:event.clientY}); if(pointers.size>=2){const p=[...pointers.values()],distance=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(gesture.pinch){setZoom(gesture.pinch.zoom*distance/gesture.pinch.distance);gesture.moved=true;}return;} if(view.zoom>1&&gesture.last){const dx=event.clientX-gesture.last.x,dy=event.clientY-gesture.last.y;if(Math.abs(dx)+Math.abs(dy)>3){const rect=precisionBoard.getBoundingClientRect(),viewBox=precisionBoard.viewBox.baseVal,half=150/view.zoom;view.cx=Math.max(half,Math.min(300-half,view.cx-dx/rect.width*viewBox.width));view.cy=Math.max(half,Math.min(300-half,view.cy-dy/rect.height*viewBox.height));applyView();gesture.last={x:event.clientX,y:event.clientY};gesture.moved=true;}} });
        function finishPrecision(event) { if(!pointers.has(event.pointerId))return; if(!gesture.moved&&pointers.size===1&&scoreFromBoard(event,precisionBoard))closePrecision(); pointers.delete(event.pointerId); if(pointers.size<2)gesture.pinch=null; }
        stage.addEventListener('pointerup',finishPrecision); stage.addEventListener('pointercancel',event=>pointers.delete(event.pointerId));
        render();
      })();
    </script>
  </body>
</html>
